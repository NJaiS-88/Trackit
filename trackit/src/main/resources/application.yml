spring:
  application:
    name: trackit
  config:
    # Loads MONGO_URI / JWT_SECRET / REDIS_URL etc. from a local .env (run from the backend folder)
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      # Work attachments (stored in MongoDB GridFS): up to 20 files per upload
      max-file-size: 10MB
      max-request-size: 50MB
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb+srv://placeholder}
      database: ${MONGO_DATABASE:trackit}
      auto-index-creation: true
    redis:
      # Upstash: the TLS connection string from the console, e.g. rediss://default:<password>@<host>.upstash.io:6379
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 5s
      connect-timeout: 5s
    web:
      pageable:
        max-page-size: 100

server:
  port: ${PORT:8081}
  # Render terminates TLS at its proxy; trust X-Forwarded-* so generated URLs use https
  forward-headers-strategy: framework
  shutdown: graceful

security:
  jwt:
    # Base64-encoded key of at least 256 bits, e.g. `openssl rand -base64 32`. No default on purpose.
    secret: ${JWT_SECRET}
    access-token-ttl: ${ACCESS_TOKEN_TTL:10m}
  refresh-token:
    # Sliding: every refresh issues a new token valid for this long
    ttl: ${REFRESH_TOKEN_TTL:7d}
    # Lets several environments share one Redis database
    key-prefix: ${REDIS_KEY_PREFIX:trackit:}
  cookies:
    # true (production): Secure; SameSite=None; Partitioned, needed because the frontend and API are on different sites.
    # false: plain-http local development only (SameSite=Lax, no Secure flag).
    secure: ${COOKIE_SECURE:true}
  cors:
    # Comma-separated exact origins, e.g. https://trackit.vercel.app,http://localhost:5173 ("*" is rejected)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

trackit:
  bootstrap-admin:
    # Created at startup only when no active admin exists; leave email/password blank to skip
    name: ${ADMIN_NAME:Administrator}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  sla:
    # Time allowed to resolve an incident (calendar time, paused while On Hold).
    # Override per environment with e.g. TRACKIT_SLA_RESOLUTION_P1=2h
    resolution:
      p1: 4h
      p2: 8h
      p3: 3d
      p4: 5d
    # "Due soon" once this share of the target time is left
    due-soon-percent: 20

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${API_DOCS_ENABLED:true}
