spring:
  application:
    name: trackit
  config:
    # Loads MONGO_URI / JWT_SECRET / JWT_EXPIRATION from a local .env (run from the backend folder)
    import: optional:file:.env[.properties]
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb+srv://placeholder}
      database: ${MONGO_DATABASE:trackit}
      auto-index-creation: true
    web:
      pageable:
        max-page-size: 100

server:
  port: ${PORT:8081}
  # Render terminates TLS at its proxy; trust X-Forwarded-* so generated URLs use https
  forward-headers-strategy: framework
  shutdown: graceful

security:
  jwt:
    # Base64-encoded key of at least 256 bits, e.g. `openssl rand -base64 32`. No default on purpose.
    secret: ${JWT_SECRET}
    # Token lifetime in milliseconds (default 24h)
    expiration: ${JWT_EXPIRATION:86400000}
  cors:
    # Comma-separated origins (patterns allowed), e.g. https://trackit.vercel.app,http://localhost:5173
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

trackit:
  bootstrap-admin:
    # Created at startup only when no active admin exists; leave email/password blank to skip
    name: ${ADMIN_NAME:Administrator}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${API_DOCS_ENABLED:true}
