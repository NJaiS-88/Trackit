# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: trackit-api
    runtime: docker
    rootDir: trackit
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MONGO_DATABASE
        value: trackit
      - key: API_DOCS_ENABLED
        value: "false"
      # Public URL of trackit-ai, e.g. https://trackit-ai.onrender.com
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_TOKEN
        fromService:
          type: web
          name: trackit-ai
          envVarKey: SERVICE_TOKEN

  - type: web
    name: trackit-ai
    runtime: python
    rootDir: "ai servive"
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Shared secret the backend sends as X-Service-Token; copied into trackit-api's AI_SERVICE_TOKEN
      - key: SERVICE_TOKEN
        generateValue: true
