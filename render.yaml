# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: trackit-api
    runtime: docker
    rootDir: trackit
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MONGO_DATABASE
        value: trackit
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: API_DOCS_ENABLED
        value: "true"
